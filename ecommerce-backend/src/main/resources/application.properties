spring.application.name=watchstore-backend
server.port=${PORT:8080}

# ---------- PostgreSQL ----------
# Create the database first: CREATE DATABASE watchstore;
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/watchstore}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- JPA ----------
# update = auto-create/alter tables from entities. Fine for a college project;
# switch to validate + migrations (Flyway) if this ever becomes a real product.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- JWT ----------
# 256-bit secret for HS256 signing. Change this before you ever deploy for real.
app.jwt.secret=${JWT_SECRET:ChangeThisToARandomLongSecretStringForYourTUProjectDemo123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- eSewa Sandbox (RC / UAT) ----------
# These are eSewa's PUBLICLY DOCUMENTED test merchant credentials for the
# developer sandbox (rc-epay.esewa.com.np). They are not secret and are safe
# to keep in this file for a student project. For production you'd get real
# merchant credentials from eSewa and store them as environment variables.
esewa.merchant-code=${ESEWA_MERCHANT_CODE:EPAYTEST}
esewa.secret-key=${ESEWA_SECRET_KEY:}
esewa.payment-url=${ESEWA_PAYMENT_URL:https://rc-epay.esewa.com.np/api/epay/main/v2/form}
esewa.status-check-url=${ESEWA_STATUS_CHECK_URL:https://rc.esewa.com.np/api/epay/transaction/status/}

esewa.success-url=${ESEWA_SUCCESS_URL:http://localhost:5173/payment/result?status=success}
esewa.failure-url=${ESEWA_FAILURE_URL:http://localhost:5173/payment/result?status=failure}

# CORS - frontend dev server
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}

logging.level.com.watchstore=DEBUG
